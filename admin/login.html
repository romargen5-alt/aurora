<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B2500;
            --primary-dark: #5B1700;
            --secondary: #C8963E;
            --cream: #FFFDF7;
            --sand: #F5E6C8;
            --dark: #1A1A1A;
            --text: #2C2C2C;
            --text-light: #5A5A5A;
            --border: #E0D5C1;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Raleway', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--cream), var(--sand));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(139, 37, 0, 0.1);
        }
        .login-card__header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-card__icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            color: var(--primary);
        }
        .login-card__title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }
        .login-card__subtitle {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--cream);
            color: var(--text);
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 37, 0, 0.1);
        }
        .btn {
            width: 100%;
            padding: 0.95rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.2s;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .error-msg {
            color: var(--primary);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
        .error-msg.show { display: block; }
        .ethno-line {
            height: 3px;
            background: repeating-linear-gradient(90deg, var(--primary) 0 15px, var(--secondary) 15px 30px, #1B4332 30px 45px, var(--secondary) 45px 60px);
            border-radius: 2px;
            margin-bottom: 2rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-light);
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="ethno-line"></div>
        <div class="login-card__header">
            <div class="login-card__icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="none" stroke="currentColor" stroke-width="2.5"/>
                    <path d="M30 5 L30 55 M5 30 L55 30" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
                    <circle cx="30" cy="30" r="14" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="30" cy="30" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="30" cy="30" r="4" fill="currentColor"/>
                </svg>
            </div>
            <h1 class="login-card__title">Админ-панель</h1>
            <p class="login-card__subtitle">Дирекция национальных видов спорта</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn">Войти</button>
            <p class="error-msg" id="errorMsg">Неверный логин или пароль</p>
        </form>
        <a href="/" class="back-link">← Вернуться на сайт</a>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    window.location.href = '/admin/index.html';
                } else {
                    document.getElementById('errorMsg').classList.add('show');
                }
            } catch (err) {
                document.getElementById('errorMsg').classList.add('show');
            }
        });
    </script>
</body>
</html>
